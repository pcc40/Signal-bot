[build]
  command = "pip install markdown pyyaml beautifulsoup4 && python3 build.py && python3 tools/i18n.py apply"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/services/owners-rep/*"
  to = "/services/owners-representative/"
  status = 301

# site.css / site-rtl.css are versioned with ?v=<hash>; fonts are preloaded with crossorigin, so allow CORS.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Full-text copy for AI assistants: readable by any crawler, but kept out of search results
# so it never competes with the real pages.
[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/insights/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Trailing slashes: every page is built as /path/index.html, and Netlify's Pretty URLs
# (on by default) 301 /path to /path/, so each page has one canonical URL.
# Common guesses for the feed and an English prefix point to the real URLs.
[[redirects]]
  from = "/feed"
  to = "/insights/feed.xml"
  status = 301

[[redirects]]
  from = "/feed.xml"
  to = "/insights/feed.xml"
  status = 301

[[redirects]]
  from = "/rss.xml"
  to = "/insights/feed.xml"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
