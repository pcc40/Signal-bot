[build]
  command = "pip install markdown pyyaml beautifulsoup4 && python3 build.py && python3 tools/i18n.py apply"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# Event-triggered function: netlify/functions/submission-created.js runs after each
# verified form submission (auto-acknowledgement + lead log). See business/automation-blueprint.md.
[functions]
  directory = "netlify/functions"

# Framing: X-Frame-Options SAMEORIGIN and CSP frame-ancestors 'self' are NOT set here. build.py write_headers()
# generates dist/_headers with those two headers for every page except the embeddable calculator
# (/tools/villa-build-cost-calculator/embed/ in each language), which gets "frame-ancestors *" instead.
# Netlify does not document which value wins when two matching rules set the same header, so the anti-framing
# rule must never match the embed path; a /* rule here would. Check with: curl -sI <url> | grep -i frame
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Domain moves: every .ae host (new and old names) sends visitors to the same page on the .com,
# so search engines see one site, not duplicates. Each host must be added to this Netlify site as a
# domain alias for these rules to run. force = true applies them even when the file exists.
[[redirects]]
  from = "https://eastbridgestrategicpartners.ae/*"
  to = "https://eastbridgestrategicpartners.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eastbridgestrategicpartners.ae/*"
  to = "https://eastbridgestrategicpartners.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eastbridgestrategicpartners.com/*"
  to = "https://eastbridgestrategicpartners.com/:splat"
  status = 301
  force = true

# The site's original Netlify hostname (live audit, 1 Nov 2026: it still served a full copy of the site).
# Host-specific, so it matches only this exact hostname: deploy previews and branch deploys are served from
# other hostnames (deploy-preview-N--incredible-haupia-7adc73.netlify.app, <branch>--incredible-haupia-7adc73.netlify.app)
# and are not redirected. The calculator embed code points at SITE_URL (the .com), so embeds are unaffected.
[[redirects]]
  from = "https://incredible-haupia-7adc73.netlify.app/*"
  to = "https://eastbridgestrategicpartners.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://eastbridgepartners.ae/*"
  to = "https://eastbridgestrategicpartners.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eastbridgepartners.ae/*"
  to = "https://eastbridgestrategicpartners.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/services/owners-rep/*"
  to = "/services/owners-representative/"
  status = 301

# site.css / site-rtl.css are versioned with ?v=<hash>; fonts are preloaded with crossorigin, so allow CORS.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Full-text copy for AI assistants: readable by any crawler, but kept out of search results
# so it never competes with the real pages.
[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/insights/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Trailing slashes: every page is built as /path/index.html, and Netlify's Pretty URLs
# (on by default) 301 /path to /path/, so each page has one canonical URL.
# Common guesses for the feed and an English prefix point to the real URLs.
[[redirects]]
  from = "/feed"
  to = "/insights/feed.xml"
  status = 301

[[redirects]]
  from = "/feed.xml"
  to = "/insights/feed.xml"
  status = 301

[[redirects]]
  from = "/rss.xml"
  to = "/insights/feed.xml"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
