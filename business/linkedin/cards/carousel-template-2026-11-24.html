<!doctype html><html><head><meta charset="utf-8"><style>
/* DealDeed LinkedIn document carousel: 1080x1350 portrait pages. Render: page.pdf({width:'1080px',height:'1350px',printBackground:true}) */
@page{size:1080px 1350px;margin:0}
*{margin:0;box-sizing:border-box}
body{background:#1E1C19;color:#F7F5F0;font-family:Georgia,'Times New Roman',serif}
.pg{width:1080px;height:1350px;padding:84px 84px 72px;display:flex;flex-direction:column;page-break-after:always;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(247,245,240,.14);padding-bottom:26px}
.logo{font-size:42px}.logo i{color:#CBA976}
.tag{font:600 18px/1 Helvetica,Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#CBA976}
.kick{font:600 20px/1.3 Helvetica,Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#8A8478;margin-top:70px}
h1{font-weight:400;font-size:104px;line-height:1.02;margin-top:26px;letter-spacing:-2px}
h1 em{color:#CBA976}
h2{font-weight:400;font-size:76px;line-height:1.08;margin-top:26px;letter-spacing:-1px}
h2 em{color:#CBA976}
.big{font-size:150px;line-height:1;letter-spacing:-3px;margin-top:20px}.big span{color:#CBA976;font-style:italic}
p{font-size:38px;line-height:1.4;color:#D8D3C8;margin-top:30px}
p b{color:#CBA976;font-weight:400}
.vs{display:flex;gap:28px;margin-top:60px}
.vs div{flex:1;border:1px solid rgba(247,245,240,.18);padding:34px 30px}
.vs small{display:block;font:600 17px/1.3 Helvetica,Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#8A8478}
.vs strong{display:block;font-weight:400;font-size:70px;margin-top:16px}
.vs .g strong{color:#CBA976}
.test{border-top:1px solid rgba(247,245,240,.14);padding:44px 0}
.test .n{font:600 18px/1 Helvetica,Arial,sans-serif;letter-spacing:4px;color:#CBA976}
.test h3{font-weight:400;font-size:62px;line-height:1.12;margin-top:14px}
.test p{font-size:36px;margin-top:18px}
ul{list-style:none;padding:0;margin-top:40px;border-top:1px solid rgba(247,245,240,.14)}
li{font-size:36px;line-height:1.3;padding:22px 0;border-bottom:1px solid rgba(247,245,240,.14)}
li:before{content:"✕  ";color:#CBA976;font-size:28px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font:400 17px/1.45 Helvetica,Arial,sans-serif;color:#8A8478}
.foot .pn{font:600 18px/1 Helvetica,Arial,sans-serif;letter-spacing:3px;color:#CBA976}
.url{font-family:Georgia,serif;font-size:44px;color:#CBA976}
.swipe{font:600 20px/1 Helvetica,Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#CBA976}
</style></head><body>
<!--SLIDES-->
</body></html>
